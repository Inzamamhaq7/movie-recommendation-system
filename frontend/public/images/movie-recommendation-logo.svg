<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Movie Recommendation System logo</title>
  <desc id="desc">Orange cinematic clapperboard with a play symbol.</desc>
  <defs>
    <linearGradient id="orange" x1="18" y1="13" x2="77" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA35"/>
      <stop offset="0.52" stop-color="#F97316"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="board" x1="19" y1="14" x2="78" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDBA35"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  <!-- Clapperboard body -->
  <rect x="13" y="31" width="70" height="53" rx="8" fill="url(#orange)"/>
  <rect x="19" y="38" width="58" height="39" rx="4" fill="#17100D" fill-opacity=".96"/>
  <!-- Clapper top -->
  <path d="M17 28.2 15.4 21.8a6 6 0 0 1 4.3-7.3l54.1-13.1a6 6 0 0 1 7.3 4.4l1.6 6.4-65.7 16Z" fill="url(#board)" transform="translate(0 10)"/>
  <!-- Clapper stripes -->
  <path d="m27.7 13.8 10.2-2.5 9.2 15.1-10.2 2.5-9.2-15.1Zm23.5-5.7 10.2-2.5 9.2 15.1-10.2 2.5-9.2-15.1Z" fill="#17100D" transform="translate(0 10)"/>
  <!-- Play symbol -->
  <path d="M43 47.5a3 3 0 0 1 4.5-2.6l17.2 10a3 3 0 0 1 0 5.2l-17.2 10a3 3 0 0 1-4.5-2.6V47.5Z" fill="url(#orange)"/>
  <!-- Subtle edge highlight -->
  <path d="M21 35h54" stroke="#FFF7ED" stroke-opacity=".25" stroke-width="2" stroke-linecap="round"/>
</svg>
